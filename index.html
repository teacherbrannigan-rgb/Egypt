<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ancient Egypt 360° Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: 'Georgia', serif; background-color: #87CEEB; }
      
      /* --- BACKGROUND IMAGE --- */
      #bg-image {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-image: url('menu-giza-ancient.jpg'); /* Your single background image */
        background-size: cover;
        background-position: center;
        z-index: 1;
      }

      /* --- MENU UI --- */
      #main-menu {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100; display: flex; flex-direction: column; 
        align-items: center; justify-content: flex-start;
        background: rgba(0, 0, 0, 0.2); /* Slight tint to make gold pop */
      }
      
      #main-title {
        color: #FFD700; /* Bright Gold */
        text-shadow: 2px 2px 8px rgba(0,0,0,0.8), 0 0 10px rgba(255, 215, 0, 0.5);
        font-size: 3.5rem; margin-top: 50px; margin-bottom: 20px;
        letter-spacing: 5px; text-transform: uppercase;
        text-align: center;
      }

      #button-container {
        display: flex; flex-direction: row; gap: 15px; flex-wrap: wrap; justify-content: center;
      }

      .xr-btn {
        padding: 15px 25px; font-size: 1rem; cursor: pointer;
        border: 2px solid #FFD700; background: rgba(0,0,0,0.8);
        color: #FFD700; border-radius: 50px; transition: 0.3s;
        font-weight: bold; text-transform: uppercase;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      .xr-btn:hover { 
        background: #FFD700; color: #000; 
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      }

      /* --- NAVIGATION --- */
      #backBtn {
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
        z-index: 8888; padding: 15px 40px; background: rgba(0,0,0,0.9);
        color: #FFD700; border: 2px solid #FFD700; border-radius: 30px;
        display: none; cursor: pointer; font-weight: bold; font-size: 1.1rem;
      }
    </style>
  </head>
  <body>

    <div id="bg-image"></div>

    <div id="main-menu">
      <h1 id="main-title">Ancient Egypt</h1>
      
      <div id="button-container">
        <button class="xr-btn" onclick="enter360('PreImg')">Pre</button>
        <button class="xr-btn" onclick="enter360('OldImg')">Old</button>
        <button class="xr-btn" onclick="enter360('MiddleImg')">Middle</button>
        <button class="xr-btn" onclick="enter360('NewImg')">New</button>
      </div>
    </div>

    <a-scene id="mainScene" style="display: none;" vr-mode-ui="enabled: true">
      <a-assets>
        <img id="PreImg" src="360-giza.jpg">
        <img id="OldImg" src="360-luxor.jpg">
        <img id="MiddleImg" src="360-nile.jpg">
        <img id="NewImg" src="360-tomb.jpg">
      </a-assets>

      <a-sky id="skyBox" radius="100" rotation="0 -90 0"></a-sky>
      
      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-entity>
    </a-scene>

    <button id="backBtn" onclick="exit360()">← EXIT TO MENU</button>

    <script>
      const menu = document.getElementById('main-menu');
      const bgImage = document.getElementById('bg-image');
      const scene = document.getElementById('mainScene');
      const sky = document.getElementById('skyBox');
      const backBtn = document.getElementById('backBtn');

      function enter360(imgId) {
        // Request motion sensor permissions for mobile VR
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
              if (permissionState === 'granted') {
                proceedToScene(imgId);
              }
            })
            .catch(console.error);
        } else {
          proceedToScene(imgId);
        }
      }

      function proceedToScene(imgId) {
        menu.style.display = 'none';
        bgImage.style.display = 'none';
        scene.style.display = 'block';
        backBtn.style.display = 'block';

        sky.setAttribute('src', '#' + imgId);
        // Force A-Frame to recalculate the view
        scene.resize();
      }

      function exit360() {
        // Refresh page to clean up memory and reset camera orientation
        location.reload();
      }
    </script>
  </body>
</html>
